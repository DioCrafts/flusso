[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.9.0"
actix-cors = "0.7.0"

# Async runtime
tokio = { version = "1.42.0", features = ["full"] }
futures = "0.3.31"

# Serialización/Deserialización
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
reqwest = { version = "0.12.12", features = ["stream", "json", "rustls-tls"] }
http = "1.2.0"

# Kubernetes integration
kube = { version = "0.98.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24.0", features = ["v1_31"] }
schemars = "0.8.21"

# Configuración
config = "0.15.4"
dotenv = "0.15.0"
num_cpus = "1.16.0"

# Logging y métricas
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
prometheus = "0.13.4"
log = "0.4.22"

# JWT y autenticación
jsonwebtoken = "9.3.0"

# Base de datos
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres"] }

# Utilidades
anyhow = "1.0.95"
thiserror = "2.0.9"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
rand = "0.8.5"
lazy_static = "1.5.0"
