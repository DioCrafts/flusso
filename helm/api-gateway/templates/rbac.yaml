apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-gateway.name" . }}-server-sa
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api-gateway.name" . }}-server-role
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]  # Acceso a recursos del grupo base
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]  # Acceso adicional a objetos de despliegue si es necesario
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "api-gateway.name" . }}-server-rb
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "api-gateway.name" . }}-server-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "api-gateway.name" . }}-server-role
  apiGroup: rbac.authorization.k8s.io

