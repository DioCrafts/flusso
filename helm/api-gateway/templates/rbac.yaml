apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-gateway.name" . }}-sa
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api-gateway.name" . }}-role
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "api-gateway.name" . }}-rb
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "api-gateway.name" . }}-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "api-gateway.name" . }}-role
  apiGroup: rbac.authorization.k8s.io
